spring:
  application:
    name: gate-away
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:7050/auth/oauth2/jwks
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        #用户服务
        - id: user-service_route
          uri: lb://user-service
          predicates:
            - Path=/user/**
        #认证服务
        - id: auth-service_route
          uri: lb://auth-service
          predicates:
              - Path=/auth/**
        #考试服务
        - id: exam-service_route
          uri: lb://exam-service
          predicates:
            - Path=/exam/**
        #问题服务
        - id: question-service_route
          uri: lb://question-service
          predicates:
            - Path=/question/**
        #消息服务 STOMP/WebSocket 握手（必须用 ws scheme 才能转发 WebSocket 升级请求）
        - id: message-websocket_route
          uri: lb:ws://message-service
          predicates:
            - Path=/message/ws,/message/ws/**,/message/ws-sockjs/**
        #消息服务
        - id: message-service_route
          uri: lb://message-service
          predicates:
            - Path=/message/**
        #AI服务
        - id: ai-service_route
          uri: lb://ai-service
          predicates:
            - Path=/ai/**

        # 1. 适配前端的考试报名接口
        - id: student-apply-rewrite_route
          uri: lb://exam-service
          predicates:
            - Path=/student/applyForExam
          filters:
            - RewritePath=/student/applyForExam, /exam/userApplyExam

        # 2. 适配前端获取已报考的个人考试列表接口
        - id: student-personal-apply-rewrite_route
          uri: lb://exam-service
          predicates:
            - Path=/student/personalApplyExams
          filters:
            - RewritePath=/student/personalApplyExams, /exam/getUserAppliedExams

        # 3. 适配前端分页获取所有考试列表的接口
        - id: student-page-exam-rewrite_route
          uri: lb://exam-service
          predicates:
            - Path=/student/getPageExams
          filters:
            - RewritePath=/student/getPageExams, /exam/getPageExams

        # 4. 适配前端考试记录获取与提交接口
        - id: exam-record-rewrite_route
          uri: lb://exam-service
          predicates:
            - Path=/examRecord/**
          filters:
            - RewritePath=/examRecord/(?<segment>.*), /exam/examRecord/${segment}

        # 5. 适配前端错题本获取接口
        - id: error-book-rewrite_route
          uri: lb://exam-service
          predicates:
            - Path=/errorBook/**
          filters:
            - RewritePath=/errorBook/(?<segment>.*), /exam/errorBook/${segment}

        # 6. 适配前端注册接口
        - id: student-register-rewrite_route
          uri: lb://user-service
          predicates:
            - Path=/register
          filters:
            - RewritePath=/register, /user/common/register

        # 7. 适配前端图形验证码接口
        - id: captcha-rewrite_route
          uri: lb://auth-service
          predicates:
            - Path=/getValidateCode
          filters:
            - RewritePath=/getValidateCode, /auth/getValidateCode

        # 8. 适配前端角色管理接口
        - id: role-rewrite_route
          uri: lb://user-service
          predicates:
            - Path=/role/**
          filters:
            - RewritePath=/role/(?<segment>.*), /user/role/${segment}

        # 9. 适配前端权限管理接口
        - id: permission-rewrite_route
          uri: lb://user-service
          predicates:
            - Path=/permission/**
          filters:
            - RewritePath=/permission/(?<segment>.*), /user/permission/${segment}

        # 10. 审计日志
        - id: audit-log-rewrite_route
          uri: lb://user-service
          predicates:
            - Path=/auditLog/**
          filters:
            - RewritePath=/auditLog/(?<segment>.*), /user/auditLog/${segment}

        # 11. 转发监考 WebSocket
        - id: proctor-websocket_route
          uri: lb:ws://exam-service
          predicates:
            - Path=/ws/proctor/**
          filters:
            - RewritePath=/ws/proctor/(?<segment>.*), /exam/ws/proctor/${segment}

      globalcors:
        cors-configurations:
          '[/**]':
            # Spring Security 的表单登录页由网关直接返回，部分浏览器对跨源顶层表单提交会发送 Origin: null。
            # 保留明确的本地开发源，同时显式允许该登录场景，生产环境应通过 CORS_ALLOWED_ORIGINS 覆盖。
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:7049,null}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: Authorization,Content-Type,Accept,token
#            allowCredentials: true # 是否允许携带 Cookie
#    sentinel:
#      transport:
#        dashboard: 127.0.0.1:8080
#      #默认是懒加载，第一次调用的时候才会加载到Dashboard里。这里取消懒加载
#      eager: true

knife4j:
  gateway:
    enabled: true
    # 指定服务发现模式：manual(手动配置) / service(服务发现) / discover(最强自动模式)
    strategy: discover
    discover:
      enabled: true
      # 指定 OpenAPI 版本，SpringBoot3 通常是 openapi3
      version: openapi3
      # 【关键】排除不需要显示文档的服务（比如网关自己、Seata、Nacos等）
      excluded-services:
        - gateway-service
        - auth-service
          #文档地址：http://localhost:7049/doc.html
server:
  port: 7049
